<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test des Images - CICE Edmonton</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .image-test {
            display: inline-block;
            margin: 10px;
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .image-test img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ff6b35;
        }
        .image-test h3 {
            margin: 10px 0 5px 0;
            font-size: 14px;
            color: #333;
        }
        .status {
            font-size: 12px;
            padding: 5px;
            border-radius: 5px;
            margin-top: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 Test des Images des Membres - CICE Edmonton</h1>
    <p>Vérification que toutes les images des membres sont accessibles :</p>
    
    <div id="image-tests"></div>

    <script>
        const images = [
            { name: 'Ambroise Gnoan (Président)', file: '/img/president.jpg' },
            { name: 'Coulibaly Tchawa Zainab (Vice-Présidente)', file: '/img/vicepresidente.png' },
            { name: 'KOUADIO Jessica Aka (Secrétaire Générale)', file: '/img/jessica.png' },
            { name: 'KOUAKOU Nadége Élodie (Trésorière)', file: '/img/Nadege.png' },
            { name: 'TEAH Charles John (Commissaire aux comptes)', file: '/img/Teah.png' },
            { name: 'KABLAN Chantal (Organisation)', file: '/img/Chantal.png' },
            { name: 'AKE Colette (Organisation)', file: '/img/Ake.png' },
            { name: 'KPOLO Oni Richard (Jeunesse/Intégration)', file: '/img/Kpolo.png' },
            { name: 'LOA Domy Fernand (Intégration)', file: '/img/Loa.png' },
            { name: 'KOMENAN Nina (Femmes)', file: '/img/Nina.png' }
        ];

        const container = document.getElementById('image-tests');

        images.forEach((image, index) => {
            const div = document.createElement('div');
            div.className = 'image-test';
            div.innerHTML = `
                <img src="${image.file}" alt="${image.name}" onload="this.nextElementSibling.className='status success'; this.nextElementSibling.textContent='✅ Chargée'" onerror="this.nextElementSibling.className='status error'; this.nextElementSibling.textContent='❌ Erreur'">
                <h3>${image.name}</h3>
                <div class="status">🔄 Chargement...</div>
            `;
            container.appendChild(div);
        });

        // Test de connectivité
        console.log('🧪 Test des images démarré...');
        console.log('📍 URL actuelle:', window.location.href);
        console.log('📁 Images à tester:', images.map(img => img.file));
    </script>
</body>
</html>
